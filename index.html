<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF4EA">
<title>Foglio Rosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* Layout: schermate a tutta pagina, ognuna col suo colore pieno; titoli enormi, pillole morbide, una mascotte che reagisce.
   Look volutamente unico (crema + colori saturi), uguale con tema chiaro e scuro. */
:root{
  color-scheme:light;
  --cream:#FBF4EA; --ink:#3B0A1E; --ink-soft:#7A4A5C; --white:#FFFFFF;
  --pink:#F6A6CF; --orange:#EC5B2C; --green:#45A866; --yellow:#F6D54A; --lilac:#C9B6FA; --teal:#5DD6C3; --plum:#4A0E26;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --page:var(--cream); --on:var(--ink);
}
html,body{height:100%}
body{background:var(--page);color:var(--on);font:500 17px/1.4 var(--body);-webkit-font-smoothing:antialiased;transition:background-color .35s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--page);z-index:10;transition:background-color .35s ease}
.wrap{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.02em;line-height:.95;text-wrap:balance}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.logo{font:800 22px var(--display);letter-spacing:-.02em}
.logo sup{font-size:11px;margin-left:1px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--cream);flex:none}
.round svg{width:22px;height:22px}
.round.light{background:rgba(255,255,255,.35);color:var(--on)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.35)}
.chip svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* Home */
.hero{position:relative;border-radius:34px;background:var(--pink);padding:24px 22px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-height:280px}
.hero .hi{font-weight:700;font-size:17px}
.hero h1{font-size:46px;max-width:9ch;position:relative;z-index:1}
.hero .mascot{position:absolute;right:-28px;bottom:-34px;width:200px}
.big{font:800 64px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;letter-spacing:0;margin-left:2px}
.stat{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;margin-top:auto}
.stat span{font-weight:700;font-size:15px;color:var(--ink-soft)}
.pills{display:flex;flex-direction:column;gap:10px}
.pill{display:flex;align-items:center;gap:14px;border-radius:999px;padding:10px 22px 10px 10px;font:700 20px var(--display);letter-spacing:-.01em;text-align:left;color:var(--ink);min-height:64px;transition:transform .15s}
.pill:active{transform:scale(.98)}
.pill .ic{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none}
.pill .ic svg{width:22px;height:22px}
.pill .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pill .tx small{font:600 14px var(--body);opacity:.75;letter-spacing:0}
.pill .n{font:800 20px var(--display)}
.pill[disabled]{opacity:.45;cursor:default}
.sec-t{font-size:30px;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:132px;color:var(--ink);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{font:700 17px/1.15 var(--body);min-width:0}
.tile .pc{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile .pc span{font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .meter{flex:1;height:8px;border-radius:4px;background:rgba(59,10,30,.15);overflow:hidden;margin-bottom:6px}
.tile .meter i{display:block;height:100%;background:var(--ink);border-radius:4px}
.foot{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:8px}

/* Onboarding */
.onb{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;text-align:center;align-items:center}
.onb .mascot{width:220px}
.onb h1{font-size:52px}
.onb input{width:100%;max-width:340px;box-sizing:border-box;border-radius:999px;border:0;padding:18px 22px;font-size:20px;font-weight:700;text-align:center;background:var(--white);color:var(--ink)}
.cta{border-radius:999px;background:var(--ink);color:var(--cream);font:800 22px var(--display);padding:18px 28px;width:100%;max-width:340px;letter-spacing:-.01em;transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta.white{background:var(--white);color:var(--ink)}
.link{font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Quiz */
.track{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.4);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.qhead{display:flex;align-items:center;gap:12px}
.tag{font-weight:700;font-size:15px;opacity:.85}
.card{background:var(--cream);color:var(--ink);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card p{margin:0;font:700 23px/1.25 var(--display);letter-spacing:-.01em}
.fig{margin:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.fig img{background:#fff;border-radius:20px;padding:10px;max-height:220px;width:auto;max-width:100%;box-sizing:border-box}
.fig.sm img{max-height:110px;border-radius:14px;padding:6px}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf button{height:84px;border-radius:999px;font:800 30px var(--display);letter-spacing:-.01em;background:var(--white);color:var(--ink);transition:transform .15s,background-color .2s,color .2s;border:3px solid transparent}
.vf button:active{transform:scale(.97)}
.vf button.sel{background:var(--ink);color:var(--cream)}
.vf button.right{background:var(--green);color:var(--white)}
.vf button.wrong{background:var(--orange);color:var(--white)}
.vf button:disabled{cursor:default}
.vf button.dim{opacity:.45}
.sheet{border-radius:30px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
.sheet.ok{background:var(--green);color:var(--white)}
.sheet.ko{background:var(--orange);color:var(--white)}
.sheet .row{display:flex;align-items:center;gap:14px}
.sheet .mascot{width:76px;flex:none}
.sheet h2{font-size:34px}
.sheet p{margin:4px 0 0;font-weight:700}
.sheet .cta{max-width:none;background:var(--white);color:var(--ink)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* Exam */
.timer{font:800 22px var(--display);font-variant-numeric:tabular-nums;border-radius:999px;padding:10px 18px;background:var(--cream);color:var(--ink)}
.timer.low{background:var(--orange);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid button{aspect-ratio:1;max-width:100%;border-radius:50%;background:rgba(255,255,255,.14);color:inherit;font:700 12px var(--body);font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--pink);color:var(--ink)}
.grid button.cur{box-shadow:0 0 0 3px var(--yellow)}
.grid button.r{background:var(--white);color:var(--green)}
.grid button.w{background:var(--ink);color:var(--white)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{border-radius:999px;padding:16px;font-weight:800;background:rgba(255,255,255,.14)}
.ghost:disabled{opacity:.35;cursor:default}
.confirm{background:var(--cream);color:var(--ink);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
.confirm p{margin:0;font:700 20px var(--display)}
.confirm div{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm .ghost{background:rgba(59,10,30,.08)}
.confirm .cta{max-width:none;padding:16px}

/* Risultati */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.result .mascot{width:210px}
.result h1{font-size:68px;text-transform:uppercase}
.result .sub{font:700 20px var(--display)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--cream);color:var(--ink);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rv p{margin:0;font-weight:700}
.rv .ans{display:flex;flex-wrap:wrap;gap:6px}
.rv .ans span{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800}
.rv .ans .you{background:rgba(236,91,44,.16);color:#B3401C}
.rv .ans .ok{background:rgba(69,168,102,.18);color:#24733F}
.score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.score .chip{background:rgba(255,255,255,.3)}

.mascot{display:block;max-width:100%;height:auto}
.mascot .body{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97) translateY(2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

,25,0,"Nei veicoli a motore a due ruote, la rottura della catena di trasmissione pregiudica la velocità di marcia, ma non la sicurezza",[]],[25441,25,0,"Nei veicoli a motore a due ruote, se la catena di trasmissione mostra segni di usura occorre rinforzarla con filo di ferro di tipo idoneo",[]],[25442,25,0,"Nei veicoli a motore a due ruote, in caso di sostituzione della catena di trasmissione per usura, non è mai necessario sostituire anche il pignone motore e la corona della ruota",[]],[25443,25,0,"Nei veicoli a motore a due ruote non è necessario il periodico controllo della tensione della catena di trasmissione, perché la stessa è dotata di tenditore automatico",[]],[25444,25,0,"Nei veicoli a motore a due ruote, la catena di trasmissione deve essere pulita con detergente sgrassante, ma assolutamente non lubrificata per non far slittare il cambio",[]],[25445,25,0,"Nei veicoli a motore a due ruote, è possibile sostituire il pignone motore e la corona della ruota in modo da modificare il rapporto di trasmissione",[]],[25446,25,1,"Nei veicoli a motore a due ruote, il livello dell'olio deve essere controllato a veicolo perfettamente orizzontale, poggiato con le ruote a terra e non sul cavalletto",[]],[25447,25,1,"Sui motocicli è necessario verificare periodicamente i livelli di olio motore e liquido freni",[]],[25448,25,1,"Sui motocicli, il livello del liquido freni si verifica controllando l'apposita vaschetta trasparente",[]],[25449,25,1,"In alcuni motori di motocicli, il livello dell'olio motore può essere controllato da un'apposita finestrella posta sulla coppa motore",[]],[25450,25,1,"Sui motocicli, il livello del lubrificante va controllato con il veicolo in piano e dopo aver spento il motore da alcuni minuti",[]],[25451,25,0,"Sui veicoli a motore a due ruote, non vi sono liquidi di cui occorre fare un controllo dei livelli perché i serbatoi sono sigillati",[]],[25452,25,0,"Sui motocicli, il livello del l'olio motore deve essere controllato con il motore in funz <script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const Q=D.q.map(([id,cap,a,t,f])=>({id:String(id),cap,a:!!a,t,f:f||[]}));
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const CAPS=Object.keys(D.caps).map(Number).filter(c=>Q.some(q=>q.cap===c));
const C={pink:'#F6A6CF',orange:'#EC5B2C',green:'#45A866',yellow:'#F6D54A',lilac:'#C9B6FA',teal:'#5DD6C3',plum:'#4A0E26',cream:'#FBF4EA',ink:'#3B0A1E'};
const CAP_COL=[C.yellow,C.lilac,C.teal,C.pink,'#FFB38A','#B8E07A'];
const capColor=c=>CAP_COL[(c-1)%CAP_COL.length];
const KEY='fogliorosa.v2';
let S={s:{},ex:[],days:[],name:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const st=id=>S.s[id]||[0,0,0];
function record(id,correct){
  const [b,n]=st(id);
  S.s[id]=correct?[Math.min(4,b+1),n+1,0]:[0,n+1,1];
  const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400)}
}
function streak(){
  const set=new Set(S.days);let d=new Date();let n=0;
  const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!set.has(key(d)))d.setDate(d.getDate()-1);
  while(set.has(key(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
const errIds=()=>Object.keys(S.s).filter(id=>S.s[id][2]&&byId[id]);
const mastery=c=>{const qs=Q.filter(q=>q.cap===c);return qs.filter(q=>st(q.id)[0]>=2).length/qs.length};
const readiness=()=>Q.filter(q=>st(q.id)[0]>=2).length/Q.length;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fig=(q,small)=>q.f.length?`<figure class="fig${small?' sm':''}">${q.f.map(f=>`<img src="figures/${f}.jpg" alt="Figura della domanda">`).join('')}</figure>`:'';
const app=document.getElementById('app');
const page=(bg,on)=>{document.body.style.setProperty('--page',bg);document.body.style.setProperty('--on',on||C.ink)};
let timerId=null,keyHandler=null;
const stopTimer=()=>{if(timerId){clearInterval(timerId);timerId=null}};
const I={
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
};

/* Mascotte: un foglio rosa con la faccia. Umori: happy, wow, sad, sweat, calm */
function mascot(mood='happy',col=C.pink){
  const eyes={happy:[0,2],wow:[0,0],sad:[0,5],sweat:[-3,1],calm:[0,3]}[mood]||[0,2];
  const mouth={
    happy:`<path d="M80 150 Q110 182 140 150 Z" fill="${C.ink}"/><rect x="100" y="150" width="9" height="10" rx="2" fill="#fff"/><rect x="112" y="150" width="9" height="10" rx="2" fill="#fff"/>`,
    wow:`<ellipse cx="110" cy="160" rx="13" ry="16" fill="${C.ink}"/>`,
    sad:`<path d="M86 168 Q110 146 134 168" stroke="${C.ink}" stroke-width="9" fill="none" stroke-linecap="round"/>`,
    sweat:`<rect x="94" y="154" width="32" height="12" rx="6" fill="${C.ink}"/>`,
    calm:`<path d="M90 154 Q110 170 130 154" stroke="${C.ink}" stroke-width="9" fill="none" stroke-linecap="round"/>`
  }[mood];
  const drops=mood==='sweat'?`<path d="M176 50 q12 18 0 26 q-12 -8 0 -26z" fill="#3B6FE0"/><path d="M190 84 q8 12 0 18 q-8 -6 0 -18z" fill="#3B6FE0"/>`:'';
  const brows=mood==='sad'?`<path d="M58 94 L90 84 M162 94 L130 84" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/>`:'';
  const eye=(cx)=>`<circle cx="${cx}" cy="112" r="24" fill="#fff"/><circle cx="${cx+eyes[0]}" cy="${112+eyes[1]}" r="${mood==='wow'?9:12}" fill="${C.ink}"/>`;
  return `<svg class="mascot" viewBox="0 0 220 230" aria-hidden="true"><g class="body">
    <path d="M38 30 Q38 18 50 18 L150 18 L190 58 L190 206 Q190 218 178 218 L50 218 Q38 218 38 206 Z" fill="${col}" stroke="${C.ink}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M150 18 L150 50 Q150 58 158 58 L190 58" fill="rgba(255,255,255,.45)" stroke="${C.ink}" stroke-width="6" stroke-linejoin="round"/>
    ${brows}${eye(78)}${eye(142)}${mouth}${drops}</g></svg>`;
}

function pickStudy(pool,n){
  const wrong=shuffle(pool.filter(q=>st(q.id)[2]));
  const fresh=shuffle(pool.filter(q=>!st(q.id)[1]));
  const rest=shuffle(pool.filter(q=>st(q.id)[1]&&!st(q.id)[2])).sort((a,b)=>st(a.id)[0]-st(b.id)[0]);
  const out=[...wrong.slice(0,Math.ceil(n/3))];
  for(const src of [fresh,rest,wrong])for(const q of src){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return shuffle(out);
}
function pickExam(){
  const out=[];const caps=shuffle([...CAPS]);
  const per={};caps.forEach(c=>per[c]=1);
  const left=30-caps.length;
  const weight=c=>Q.filter(q=>q.cap===c).length;
  const tot=caps.reduce((s,c)=>s+weight(c),0);
  caps.forEach(c=>{per[c]+=Math.floor(weight(c)/tot*left)});
  let sum=caps.reduce((s,c)=>s+per[c],0);
  for(let i=0;sum<30;i++,sum++)per[caps[i%caps.length]]++;
  caps.forEach(c=>out.push(...shuffle(Q.filter(q=>q.cap===c)).slice(0,per[c])));
  return shuffle(out).slice(0,30);
}

/* BENVENUTO */
function welcome(){
  stopTimer();keyHandler=null;page(C.yellow);
  app.innerHTML=`
  <div class="bar"><span class="logo">Foglio Rosa<sup>®</sup></span></div>
  <div class="onb">
    ${mascot('happy')}
    <h1>Come ti chiami?</h1>
    <input id="name" autocomplete="given-name" maxlength="24" placeholder="Il tuo nome" aria-label="Il tuo nome">
    <button class="cta" id="go">Iniziamo</button>
    <button class="link" id="skip">Salta</button>
  </div>`;
  const inp=app.querySelector('#name');
  const go=()=>{S.name=inp.value.trim()||'';save();home()};
  app.querySelector('#go').onclick=go;
  app.querySelector('#skip').onclick=()=>{S.name='';save();home()};
  inp.onkeydown=e=>{if(e.key==='Enter')go()};
}

/* HOME */
function home(){
  stopTimer();keyHandler=null;page(C.cream);
  if(S.name===null)return welcome();
  const errs=errIds().length, r=readiness(), s=streak(), last=S.ex.slice(-1)[0];
  const passed=S.ex.filter(e=>e.e<=3).length;
  const mood=r>=.8?'happy':errs>20?'sweat':r>0?'calm':'happy';
  app.innerHTML=`
  <div class="bar"><span class="logo">Foglio Rosa<sup>®</sup></span><div class="chips">${s?`<span class="chip" style="background:${C.yellow}">${I.flame}${s} ${s===1?'giorno':'giorni'}</span>`:''}</div></div>
  <section class="hero">
    <span class="hi">${S.name?'Ciao, '+esc(S.name):'Ciao!'}</span>
    <h1>${r===0?'Pronto per la teoria?':r<.5?'Si va avanti!':r<.85?'Ci sei quasi!':'Pronto per l\'esame!'}</h1>
    <div class="stat"><div class="big">${Math.round(r*100)}<small>%</small></div><span>preparazione</span></div>
    ${mascot(mood,C.pink)}
  </section>
  <div class="pills">
    <button class="pill" id="go-exam" style="background:${C.orange};color:${C.white||'#fff'}"><span class="ic">${I.clock}</span><span class="tx" style="color:#fff">Simulazione d'esame<small>30 domande · 20 minuti · max 3 errori</small></span>${last?`<span class="n" style="color:#fff">${passed}/${S.ex.length}</span>`:''}</button>
    <button class="pill" id="go-err" style="background:${C.yellow}" ${errs?'':'disabled'}><span class="ic">${I.redo}</span><span class="tx">Ripassa gli errori</span>${errs?`<span class="n">${errs}</span>`:''}</button>
    <button class="pill" id="go-mix" style="background:${C.teal}"><span class="ic">${I.shuffle}</span><span class="tx">Allenamento misto</span></button>
  </div>
  <h2 class="sec-t">Argomenti</h2>
  <div class="tiles">
  ${CAPS.map(c=>{const m=mastery(c);return `<button class="tile" data-c="${c}" style="background:${capColor(c)}"><b>${esc(D.caps[c])}</b><div class="pc"><div class="meter"><i style="width:${m*100}%"></i></div><span>${Math.round(m*100)}%</span></div></button>`}).join('')}
  </div>
  <p class="foot">Domande e figure dal listato ufficiale «Patente AB» del Ministero delle Infrastrutture e dei Trasporti, pubblicato sul Portale dell'Automobilista (licenza CC BY 3.0 IT), nell'adattamento del progetto Patente Pronta. Non affiliato al Ministero.</p>`;
  app.querySelector('#go-exam').onclick=exam;
  app.querySelector('#go-err').onclick=()=>study(shuffle(errIds().map(id=>byId[id])).slice(0,20),'Ripasso errori',{review:true,col:C.yellow});
  app.querySelector('#go-mix').onclick=()=>study(pickStudy(Q,15),'Allenamento misto',{col:C.teal});
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;study(pickStudy(Q.filter(q=>q.cap===c),15),D.caps[c],{cap:c,col:capColor(c)})});
  window.scrollTo(0,0);
}

/* STUDIO */
function study(list,title,opt={}){
  if(!list.length)return home();
  page(opt.col||C.lilac);
  let i=0,good=0,answered=null;
  const draw=()=>{
    const q=list[i];
    app.innerHTML=`
    <div class="qhead"><button class="round" id="x" aria-label="Esci">${I.x}</button><div class="track"><i style="width:${i/list.length*100}%"></i></div></div>
    <span class="tag">${esc(opt.cap||opt.review?title:D.caps[q.cap])}</span>
    <article class="card">${fig(q)}<p>${esc(q.t)}</p></article>
    <div class="vf"><button id="v">Vero</button><button id="f">Falso</button></div>
    <div id="after"></div>`;
    app.querySelector('#x').onclick=home;
    const v=app.querySelector('#v'),f=app.querySelector('#f');
    const answer=val=>{
      if(answered!==null)return;answered=val;
      const ok=val===q.a;if(ok)good++;record(q.id,ok);save();
      v.disabled=f.disabled=true;
      (q.a?v:f).classList.add('right');if(!ok)(val?v:f).classList.add('wrong');else (q.a?f:v).classList.add('dim');
      const msgs=ok?['Giusto!','Esatto!','Perfetto!','Bravo!']:['Ops!','Quasi!','Niente paura'];
      app.querySelector('#after').innerHTML=`<div class="sheet ${ok?'ok':'ko'}"><div class="row">${mascot(ok?'happy':'sad',ok?C.yellow:C.pink)}<div><h2>${msgs[Math.random()*msgs.length|0]}</h2><p>${ok?'Risposta corretta':'L\'affermazione è '+(q.a?'vera':'falsa')}</p></div></div><button class="cta" id="n">${i+1<list.length?'Avanti':'Vedi com\'è andata'}</button></div>`;
      const n=app.querySelector('#n');n.onclick=next;n.focus({preventScroll:true});
      app.querySelector('#after').scrollIntoView({behavior:'smooth',block:'end'});
    };
    v.onclick=()=>answer(true);f.onclick=()=>answer(false);
    window.scrollTo(0,0);
  };
  const next=()=>{answered=null;i++;if(i<list.length)draw();else end()};
  const end=()=>{
    const ratio=good/list.length, great=ratio>=.9;
    page(great?C.green:C.lilac,great?'#fff':C.ink);
    app.innerHTML=`
    <div class="bar"><button class="round" id="x" aria-label="Torna alla home">${I.back}</button></div>
    <div class="result">${mascot(great?'happy':ratio>=.6?'calm':'sweat',great?C.yellow:C.pink)}
      <h1>${good}/${list.length}</h1>
      <div class="sub">${good===list.length?'Tutte giuste!':great?'Quasi perfetto':ratio>=.6?'Buon lavoro, continua così':'Gli errori finiscono nel ripasso'}</div>
    </div>
    <button class="cta${great?' white':''}" id="again" style="max-width:none">Continua</button>
    <button class="link" id="h">Torna alla home</button>`;
    app.querySelector('#x').onclick=home;app.querySelector('#h').onclick=home;
    app.querySelector('#again').onclick=()=>{
      if(opt.review){const e=errIds();e.length?study(shuffle(e.map(id=>byId[id])).slice(0,20),title,opt):home()}
      else study(pickStudy(opt.cap?Q.filter(q=>q.cap===opt.cap):Q,15),title,opt);
    };
    window.scrollTo(0,0);
  };
  keyHandler=e=>{if(answered===null){if(e.key==='v'||e.key==='V')app.querySelector('#v')?.click();if(e.key==='f'||e.key==='F')app.querySelector('#f')?.click()}else if(e.key==='Enter'&&document.activeElement?.id!=='n')app.querySelector('#n')?.click()};
  draw();
}

/* ESAME */
function exam(){
  page(C.plum,C.cream);
  const list=pickExam();const ans=new Array(list.length).fill(null);
  let i=0,left=20*60,confirming=false;
  const end=Date.now()+left*1000;
  const draw=()=>{
    const q=list[i];
    app.innerHTML=`
    <div class="bar"><button class="round light" id="x" aria-label="Abbandona" style="color:${C.cream}">${I.x}</button><span class="timer" id="t"></span></div>
    <div class="grid">${list.map((_,k)=>`<button data-k="${k}" class="${ans[k]!==null?'done':''} ${k===i?'cur':''}" aria-label="Domanda ${k+1}">${k+1}</button>`).join('')}</div>
    <span class="tag">Domanda ${i+1} di 30</span>
    <article class="card">${fig(q)}<p>${esc(q.t)}</p></article>
    <div class="vf"><button id="v" class="${ans[i]===true?'sel':''}">Vero</button><button id="f" class="${ans[i]===false?'sel':''}">Falso</button></div>
    <div class="nav"><button class="ghost" id="p" ${i?'':'disabled'}>Indietro</button><button class="ghost" id="n" ${i<list.length-1?'':'disabled'}>Avanti</button></div>
    ${confirming?`<div class="confirm"><p>${ans.includes(null)?`Mancano ${ans.filter(a=>a===null).length} risposte: contano come errori.`:'Consegni la scheda?'}</p><div><button class="ghost" id="no">Continua</button><button class="cta" id="yes">Consegna</button></div></div>`:`<button class="cta white" id="end" style="max-width:none">Consegna</button>`}`;
    tick();
    app.querySelector('#x').onclick=()=>{stopTimer();home()};
    app.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;draw()});
    const set=val=>{ans[i]=val;if(i<list.length-1)i++;draw()};
    app.querySelector('#v').onclick=()=>set(true);app.querySelector('#f').onclick=()=>set(false);
    app.querySelector('#p').onclick=()=>{i--;draw()};app.querySelector('#n').onclick=()=>{i++;draw()};
    if(confirming){app.querySelector('#no').onclick=()=>{confirming=false;draw()};app.querySelector('#yes').onclick=finish;app.querySelector('.confirm').scrollIntoView({block:'nearest'})}
    else app.querySelector('#end').onclick=()=>{confirming=true;draw()};
  };
  const tick=()=>{
    left=Math.max(0,Math.round((end-Date.now())/1000));
    const t=app.querySelector('#t');
    if(t){t.textContent=`${String(left/60|0).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;t.classList.toggle('low',left<=120)}
    if(left<=0)finish();
  };
  const finish=()=>{
    stopTimer();keyHandler=null;
    let e=0;list.forEach((q,k)=>{const ok=ans[k]===q.a;if(!ok)e++;record(q.id,ok)});
    S.ex.push({d:Date.now(),e});S.ex=S.ex.slice(-50);save();
    const pass=e<=3;const wrong=list.map((q,k)=>({q,a:ans[k],k})).filter(x=>x.a!==x.q.a);
    page(pass?C.green:C.orange,'#fff');
    app.innerHTML=`
    <div class="bar"><button class="round" id="x" aria-label="Torna alla home">${I.back}</button></div>
    <div class="result">${mascot(pass?'happy':'sad',pass?C.yellow:C.pink)}
      <h1>${pass?'Idoneo':'Non idoneo'}</h1>
      <div class="score"><span class="chip">${e} ${e===1?'errore':'errori'} su 30</span>${left<=0?'<span class="chip">Tempo scaduto</span>':''}</div>
    </div>
    <div class="grid">${list.map((q,k)=>`<button data-k="${k}" class="${ans[k]===q.a?'r':'w'}" aria-label="Domanda ${k+1}">${k+1}</button>`).join('')}</div>
    ${wrong.length?`<section class="review">${wrong.map(({q,a,k})=>`<div class="rv" id="rv${k}">${fig(q,1)}<p>${esc(q.t)}</p><div class="ans">${a===null?'<span class="you">Senza risposta</span>':`<span class="you">Hai detto ${a?'vero':'falso'}</span>`}<span class="ok">È ${q.a?'vera':'falsa'}</span></div></div>`).join('')}</section>`:''}
    <button class="cta white" id="again" style="max-width:none">Nuova simulazione</button>
    <button class="link" id="h" style="color:#fff">Torna alla home</button>`;
    app.querySelector('#x').onclick=home;app.querySelector('#h').onclick=home;app.querySelector('#again').onclick=exam;
    app.querySelectorAll('.grid button.w').forEach(b=>b.onclick=()=>document.getElementById('rv'+b.dataset.k)?.scrollIntoView({behavior:'smooth',block:'center'}));
    window.scrollTo(0,0);
  };
  keyHandler=e=>{if(e.key==='v'||e.key==='V')app.querySelector('#v')?.click();if(e.key==='f'||e.key==='F')app.querySelector('#f')?.click();if(e.key==='ArrowRight')app.querySelector('#n')?.click();if(e.key==='ArrowLeft')app.querySelector('#p')?.click()};
  stopTimer();timerId=setInterval(tick,1000);
  draw();window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==='INPUT')return;keyHandler&&keyHandler(e)});
home();
})();
</script>
